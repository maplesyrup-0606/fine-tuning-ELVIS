# Every locked decision for this experiment lives here.
# Scripts read from this file; changes should be made here, not in code.

experiment:
  name: Qwen3-VL-4B-fine-tuning-continuity
  hypothesis: >
    Fine-tuning Qwen3-VL-4B on ELVIS continuity via LoRA improves its Gestalt
    perceptual ability, and this improvement transfers to general vision
    performance as measured by SEED-Bench-2.
  seed: 42

model:
  base_id: Qwen/Qwen3-VL-4B-Instruct
  loader: elvis.scripts.baseline_models.qwen.load_qwen_model  # reused from ELVIS

lora:
  # Shared LoRA hyperparameters across all three variants. Per-variant
  # routing (which modules get LoRA) lives under `variants:` below.
  rank: 4
  alpha: 8
  dropout: 0.0

variants:
  # Three fine-tuning ablations. Each becomes a separate `swift sft` run
  # with its own output dir and WandB run. Selected via
  # `python scripts/train.py --variant {llm|projector|both}`.
  #
  # Mechanism: ms-swift routes LoRA to the non-frozen components when
  # target_modules=['all-linear']. See arguments/tuner_args.py docstring
  # in ms-swift 4.5.3 for the freeze_* semantics.
  llm:
    description: LoRA on all linear layers of the LLM. Vision tower + merger frozen.
    target_modules: [all-linear]
    freeze_llm: false
    freeze_vit: true
    freeze_aligner: true
  projector:
    description: LoRA on the vision→LLM merger (aligner) only. LLM + vision tower frozen.
    target_modules: [all-linear]
    freeze_llm: true
    freeze_vit: true
    freeze_aligner: false
  both:
    description: LoRA on LLM + merger. Vision tower frozen.
    target_modules: [all-linear]
    freeze_llm: false
    freeze_vit: true
    freeze_aligner: false

data:
  source: elvis_continuity
  principle: continuity
  split_used_for_finetuning: train  # test split held out for evaluation

  regeneration:
    num_pos_per_pattern: 9   # first 3 → Stage 1 examples, remaining 6 → fine-tuning
    num_neg_per_pattern: 9
    img_size: 224
    num_patterns: 432  # continuity total

  stage1_examples_per_side: 3  # matches ELVIS img_num default
  finetuning_samples_per_side: 6  # v1: 9 - 3 = 6
  total_finetuning_samples: 5184  # v1: 432 patterns * 2 sides * 6 samples

  # v2: dedicated fine-tuning splits (ELVIS train/test stay the eval set).
  # Generated by slurm/gen_ft_data.sh. Episode = 3+3 examples + 3+3 queries.
  v2_splits:
    ft_train: {num_samples: 12, seed: 1, episodes_per_pattern: 2}
    ft_val:   {num_samples: 6,  seed: 2, episodes_per_pattern: 1}

rules:
  # v2: ground-truth rules per (pattern, episode) from generator metadata
  # (scripts/generate_programmatic_rules.py). Schema: EXPERIMENT.md "Rule schema".
  generator: scripts/generate_programmatic_rules.py
  source_model: null
  train_path: data/continuity/rules_ft_train.json
  val_path: data/continuity/rules_ft_val.json
  # v1: distilled from base Qwen3-VL-4B by scripts/generate_rules.py
  # (elvis.scripts.baseline_models.qwen.infer_logic_rules).
  cache_path: data/continuity/rules.json

training:
  framework: ms-swift
  # v2 multi-task data (scripts/build_dataset.py). v1 data: data/continuity/train.jsonl
  dataset_path: data/continuity/train_v2.jsonl
  val_dataset_path: data/continuity/val_v2.jsonl
  # Checkpoints: $ELVIS_FINETUNING_RESULTS/<checkpoint_subdir>/<variant>/v<N>-<ts>/checkpoint-*
  # v1 checkpoints live in checkpoints/ — kept separate so v2 can never resume from v1.
  checkpoint_subdir: checkpoints_v2
  wandb_run_prefix: continuity-v2
  objective_balance:
    # Share of the weighted answer-text loss given to Stage 2 (classification);
    # Stage 1 (rule writing) gets the rest. Applied via per-row loss_scale;
    # requires `--is_binary_loss_scale false`. See EXPERIMENT.md decision A.
    classify_share: 0.5
  per_device_batch_size: 4
  gradient_accumulation_steps: 8
  effective_batch_size: 32
  max_epochs: 3
  learning_rate: 5.0e-5
  lr_scheduler: cosine
  warmup_ratio: 0.03
  checkpoint_every: epoch
  best_checkpoint_metric: continuity_test_accuracy

  early_stopping:
    metric: continuity_test_accuracy
    target_absolute: 0.67   # ~7% absolute over 0.5976 baseline
    regression_patience: 1  # stop if this epoch's accuracy < previous epoch

v3:
  # Classification only, with ground-truth rubrics (EXPERIMENT.md "v3 Plan").
  # Data: slurm/gen_v3_data.sh -> scripts/build_v3_dataset.py. Train with
  # `train.py --run <name>` / `sbatch slurm/train.sh <variant> <name>`; variants llm, both.
  # Same LoRA/optimizer/epochs (3) as v1/v2: each principle's rows are seen 3 times in
  # both runs, so `all` makes ~6x the updates of `continuity` (2,790 vs 486 steps).
  checkpoint_subdir: checkpoints_v3     # -> <results>/checkpoints_v3/<run>/<variant>/
  wandb_run_prefix: v3                  # -> v3-<run>-<variant>
  runs:
    continuity:
      dataset_path: data/v3/ft_train_continuity.jsonl       # 5,184 rows
      val_dataset_path: data/v3/ft_val_continuity.jsonl     # 5,184 rows
    all:
      dataset_path: data/v3/ft_train_all.jsonl              # 29,784 rows
      val_dataset_path: data/v3/ft_val_all.jsonl#5000       # ms-swift samples 5,000 (seeded)

wandb:
  project: Qwen3-VL-4B-fine-tuning-continuity

evaluation:
  # v2 eval outputs: $ELVIS_FINETUNING_RESULTS/<results_subdir>/ (v1 used eval/).
  # Kept separate so aggregate_results.py never mixes v1 and v2 rows.
  results_subdir: eval_v2
  # v3 rubric evaluation (eval_elvis.py --rubrics): Stage 1 skipped, the pattern's
  # ground-truth rubric is given instead. Kept apart from model-written-rule results.
  rubric_results_subdir: eval_v3_rubric
  # Stage 1 (rule writing) generation budget, passed to ELVIS
  # _run_qwen_baseline(rule_max_new_tokens=...). ELVIS's default is 128, which
  # truncated 92% of base rules and is below the longest v2 GT rule (130 tokens).
  # Generation stops at end-of-turn, so a high cap only costs time when a model
  # rambles. Applies to every model in v2, base included.
  rule_max_new_tokens: 1024

  # In-distribution: did fine-tuning learn the target task?
  per_epoch:
    - name: elvis_continuity_test
      method: mode_1_baseline  # ELVIS._run_qwen_baseline, unchanged
      data_split: test

  # Negative-transfer check: did fine-tuning on continuity damage the
  # model's ability on the other 4 Gestalt principles? Runs Mode 1 on
  # each variant's best checkpoint (as selected by continuity accuracy).
  # Same evaluator as ELVIS's own baseline, apples-to-apples.
  sibling_principles:
    method: mode_1_baseline
    principles: [proximity, similarity, closure, symmetry]
    scope: best_checkpoint_per_variant

  # General-vision transfer: does Gestalt improvement generalize?
  final:
    - name: elvis_continuity_test
      method: mode_1_baseline
      data_split: test
    - name: seed_bench_2
      harness: VLMEvalKit
      scope: full  # all 27 dimensions

  baseline_reference:
    continuity_mode1_base: 0.5976  # from ELVIS results/continuity/baseline/20260630
    seed_bench_2_base: null        # TBD — SEED-Bench-2 chained baseline in progress
    sibling_mode1_base: null       # TBD — populate via `sbatch -J base slurm/eval_elvis.sh base ""`

paths:
  elvis_root_env: ELVIS_ROOT
  elvis_data_env: ELVIS_DATA
  results_env: ELVIS_FINETUNING_RESULTS

cluster:
  name: fir
  training_gpu: 3g.40gb  # MIG slice
  eval_gpu: h100:1       # full H100 for SEED-Bench-2 final run

elvis_dependency:
  mechanism: env_var_plus_sys_path
  required_env: ELVIS_ROOT
  required_changes_to_elvis:
    - scripts/main.py: add --num_samples and --splits CLI flags (needed for Task #7)
